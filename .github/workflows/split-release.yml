name: Split Repos Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Input your tag'
        required: true
      component:
        description: 'Input your component name'
        required: false

jobs:
  split:
    if: github.repository == 'mineadmin/components'
    runs-on: ubuntu-latest
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SPLIT_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Private Key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
      - name: Split And Push
        run: |
          git config pull.rebase true
          git config --global user.email "49744633+zds-s@users.noreply.github.com"
          git config --global user.name "Zds"
          if [ -z "${{ github.event.inputs.component }}" ]; then
            ./bin/release.sh ${{ github.event.inputs.tag }}
          else
            ./bin/release.sh ${{ github.event.inputs.tag }} ${{ github.event.inputs.component }}
          fi